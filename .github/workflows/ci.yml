name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y doxygen python3-yaml ripgrep
      - name: Test C0 verifier orchestration
        run: Tests/C0/test-baseline-verifier.sh
      - name: Build and test the C++ core
        run: make test all demo-rom
      - name: Run C1 contract aggregate
        env:
          C1_REQUIRE_TSAN: "1"
        run: make test-c1
      - name: Run portable C2 contract aggregate
        env:
          C2_REQUIRE_TSAN: "1"
        run: make test-c2-portable
      - name: Run native sanitizers
        run: make sanitize
      - name: Run ThreadSanitizer race gate
        env:
          C1_REQUIRE_TSAN: "1"
        run: make thread-sanitize
      - name: Check C++ formatting
        run: make format-check
      - name: Validate portable code documentation
        run: DOCS_BASE=origin/develop make docs-check DOCS_PROFILE=portable

  apple-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verification tools
        run: |
          brew install doxygen ripgrep
          python3 -m venv .build/ci-python
          .build/ci-python/bin/python -m pip install pyyaml
          echo "${PWD}/.build/ci-python/bin" >> "${GITHUB_PATH}"
      - name: Test C0 verifier orchestration
        run: Tests/C0/test-baseline-verifier.sh
      - name: Test the Swift package
        run: swift test
      - name: Build the SwiftUI demo
        run: swift build
      - name: Run machine target-profile contract aggregate
        run: make test-machine-target-profile
      - name: Run Model B workflow contract aggregate
        run: make test-model-b-workflow
      - name: Run Apple C2 Xcode contract
        run: make test-c2-xcode
      - name: Validate complete code documentation
        run: DOCS_BASE=origin/develop make docs-check DOCS_PROFILE=macos

  c0-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y doxygen ripgrep
      - name: Run complete portable C0 evidence
        run: make verify-c0 C0_PROFILE=portable

  c0-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install verification tools
        run: brew install doxygen ripgrep
      - name: Run complete macOS C0 evidence
        run: make verify-c0 C0_PROFILE=macos
