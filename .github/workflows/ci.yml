name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the C++ core
        run: make test all demo-rom
      - name: Run native sanitizers
        run: make sanitize

  apple-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the Swift package
        run: swift test
      - name: Build the SwiftUI demo
        run: swift build
